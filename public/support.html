<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Support | Split Happens</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #4b5563;
        --accent: #2563eb;
        --border: #e5e7eb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }
      main {
        max-width: 760px;
        margin: 32px auto;
        padding: 24px;
      }
      article {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 28px;
      }
      h1 { margin-top: 0; margin-bottom: 12px; line-height: 1.25; }
      p { color: var(--muted); }
      a { color: var(--accent); }
      @media (max-width: 640px) {
        main { margin: 14px auto; padding: 12px; }
        article { padding: 20px; }
      }
    </style>
  </head>
  <body>
    <main>
      <article>
        <h1>Support</h1>
        <p>
          Need help with Split Happens? We are happy to assist.
        </p>
        <p>
          Contact support at
          <a href="mailto:uncommoncrawl@gmail.com">uncommoncrawl@gmail.com</a>.
        </p>
      </article>
    </main>
  </body>
</html>
